# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - OrangeHRM-PlaywrightTS-Project

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Diagnose Azure OIDC
        run: |
          echo "Checking if secrets are set:"
          if [ -z "${{ secrets.AZUREAPPSERVICE_CLIENTID_0E8706EACC954FA1BAA9F98C26944288 }}" ]; then
          echo "ERROR: Client ID secret is empty!"
          else
          echo "Client ID is set"
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps

      - name: Build and test
        run: |
          npm run build --if-present
          npm test -- --workers=4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/
          if-no-files-found: ignore

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Clear Azure CLI cache
        run: |
          az account clear || true
          rm -rf ~/.azure || true

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E8706EACC954FA1BAA9F98C26944288 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BDE64D0E06294D3F9BAD24CEDDFED462 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F0341581CB1F48BC829B7EC3E9D7B166 }}
          allow-no-subscriptions: true

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "OrangeHRM-PlaywrightTS-Project"
          slot-name: "Production"
          package: .
